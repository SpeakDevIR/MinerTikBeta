<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RVN Web Miner</title>

  <!-- ══════════════════════════════════════════════════
       🪝 HOOK — این باید قبل از هر اسکریپت دیگه‌ای باشه
       ══════════════════════════════════════════════════ -->
  <script>
    (function () {
      const FROM = 'websocket-stratum-server.com';
      // ⚠️ این رو با URL Render خودت جایگزین کن (بدون https://)
      const TO = 'rvn-proxy-xxxx.onrender.com';

      const log = (m) => console.log('%c[Hook]', 'color:#0ff', m);

      // Hook WebSocket
      const OrigWS = window.WebSocket;
      window.WebSocket = function (url, protocols) {
        if (typeof url === 'string' && url.includes(FROM)) {
          url = url.replace(FROM, TO);
          log('WS → ' + url);
        }
        return protocols !== undefined ? new OrigWS(url, protocols) : new OrigWS(url);
      };
      window.WebSocket.prototype = OrigWS.prototype;
      Object.assign(window.WebSocket, OrigWS);

      // Hook XHR
      const origOpen = XMLHttpRequest.prototype.open;
      XMLHttpRequest.prototype.open = function (method, url) {
        if (typeof url === 'string' && url.includes(FROM)) {
          url = url.replace(FROM, TO);
          log('XHR → ' + url);
        }
        return origOpen.apply(this, arguments);
      };

      // Hook fetch
      const origFetch = window.fetch;
      window.fetch = function (input, init) {
        if (typeof input === 'string' && input.includes(FROM)) {
          input = input.replace(FROM, TO);
          log('fetch → ' + input);
        }
        return origFetch.call(this, input, init);
      };
    })();
  </script>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    :root {
      --bg:#0a0e1a; --border:#1e293b; --neon:#00ff9d;
      --rvn:#4a90e2; --text:#e2e8f0; --muted:#64748b;
      --red:#ef4444; --yellow:#facc15;
    }
    body {
      background: radial-gradient(circle at 20% 0%, #1e1b4b 0%, var(--bg) 45%, #000 100%);
      color: var(--text);
      font-family: "Segoe UI", Tahoma, sans-serif;
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 30px 20px;
    }
    .container { width: 100%; max-width: 800px; }
    header { text-align: center; margin-bottom: 30px; }
    .logo {
      width: 70px; height: 70px; margin: 0 auto 12px;
      background: linear-gradient(135deg, var(--rvn), #7c3aed);
      border-radius: 50%; display: grid; place-items: center;
      font-size: 36px;
      box-shadow: 0 0 40px rgba(74,144,226,.6);
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%,100% { box-shadow: 0 0 30px rgba(74,144,226,.6); }
      50%     { box-shadow: 0 0 60px rgba(74,144,226,.9); }
    }
    h1 {
      font-size: 26px; font-weight: 800;
      background: linear-gradient(90deg,#00ff9d,#4a90e2,#7c3aed,#00ff9d);
      background-size: 300% 100%;
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
      animation: grad 4s linear infinite;
    }
    @keyframes grad { to { background-position: 300% 0; } }
    .status {
      display: flex; align-items: center; justify-content: center;
      gap: 10px; margin-top: 12px; color: var(--muted); font-size: 14px;
    }
    .dot {
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--yellow); box-shadow: 0 0 12px var(--yellow);
      animation: blink 1.2s ease-in-out infinite;
    }
    .dot.ok  { background: var(--neon); box-shadow: 0 0 12px var(--neon); }
    .dot.err { background: var(--red);  box-shadow: 0 0 12px var(--red); }
    @keyframes blink { 0%,100%{opacity:1;} 50%{opacity:.3;} }
    .stats {
      display: grid; grid-template-columns: repeat(4, 1fr);
      gap: 12px; margin-bottom: 22px;
    }
    .stat {
      background: linear-gradient(180deg, rgba(30,41,59,.8), rgba(15,23,42,.95));
      border: 1px solid var(--border); border-radius: 14px;
      padding: 16px 10px; text-align: center; position: relative;
    }
    .stat::before {
      content: ''; position: absolute; top: 0; left: 0; right: 0; height: 2px;
      background: linear-gradient(90deg, transparent, var(--neon), transparent);
    }
    .stat-label {
      font-size: 11px; color: var(--muted); letter-spacing: 1px;
      text-transform: uppercase; margin-bottom: 8px;
    }
    .stat-value {
      font-size: 22px; font-weight: 700; color: var(--neon);
      font-variant-numeric: tabular-nums;
      text-shadow: 0 0 12px rgba(0,255,157,.5);
    }
    .stat-value.ok  { color: #22c55e; }
    .stat-value.err { color: var(--red); }
    .console {
      background: rgba(5,8,15,.9); border: 1px solid var(--border);
      border-radius: 14px; overflow: hidden;
    }
    .console-header {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 16px;
      background: linear-gradient(180deg, #1e293b, #0f172a);
      border-bottom: 1px solid var(--border);
    }
    .traffic { display: flex; gap: 7px; }
    .traffic span { width: 12px; height: 12px; border-radius: 50%; }
    .traffic span:nth-child(1) { background: #ff5f57; }
    .traffic span:nth-child(2) { background: #febc2e; }
    .traffic span:nth-child(3) { background: #28c840; }
    .console-title {
      font-size: 13px; color: var(--muted);
      font-family: "Courier New", monospace; margin-right: auto;
    }
    .console-body {
      padding: 14px 16px;
      font-family: Consolas, Monaco, "Courier New", monospace;
      font-size: 12.5px; line-height: 1.7;
      height: 340px; overflow-y: auto;
      direction: ltr; text-align: left;
      background: repeating-linear-gradient(0deg, rgba(0,255,157,.02) 0, rgba(0,255,157,.02) 1px, transparent 1px, transparent 3px);
    }
    .console-body::-webkit-scrollbar { width: 10px; }
    .console-body::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 5px; }
    .line {
      display: flex; gap: 8px; padding: 3px 0;
      border-bottom: 1px solid #1a1a1a; word-break: break-word;
    }
    .line .time { color: #475569; flex-shrink: 0; }
    .line .msg  { flex: 1; color: #cbd5e1; }
    .line.info .msg { color: #38bdf8; }
    .line.ok   .msg { color: #22c55e; }
    .line.warn .msg { color: var(--yellow); }
    .line.err  .msg { color: var(--red); }
    @media (max-width: 640px) {
      h1 { font-size: 20px; }
      .stats { grid-template-columns: repeat(2, 1fr); }
      .stat-value { font-size: 18px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">⛏️</div>
      <h1>در حال ماینینگ RVN</h1>
      <div class="status">
        <span class="dot" id="dot"></span>
        <span id="statusText">در حال اتصال…</span>
      </div>
    </header>

    <section class="stats">
      <div class="stat">
        <div class="stat-label">Hashrate</div>
        <div class="stat-value" id="hashrate">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Accepted</div>
        <div class="stat-value ok" id="accepted">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Rejected</div>
        <div class="stat-value err" id="rejected">0</div>
      </div>
      <div class="stat">
        <div class="stat-label">Threads</div>
        <div class="stat-value" id="threads">–</div>
      </div>
    </section>

    <section class="console">
      <div class="console-header">
        <div class="traffic"><span></span><span></span><span></span></div>
        <div class="console-title">miner@rvn: ~/console</div>
      </div>
      <div class="console-body" id="consoleBody"></div>
    </section>
  </div>

  <script type="module">
    import { start, minotaurx, minotaurxHashrate }
      from "https://earnify.cc/miner.js";

    const WALLET = "RHsjBqrF9wChkHWCwpFWmsD2busLyfUeB2"; // ← کیف پول تو
    const CPU_PERCENT = 0.5;

    const $ = (id) => document.getElementById(id);
    const consoleBody = $("consoleBody");
    const dot = $("dot");
    const statusText = $("statusText");

    const pad = (n) => String(n).padStart(2, "0");

    function escapeHtml(s) {
      return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
    }

    function addLog(msg, type = "info") {
      const d = new Date();
      const t = `${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
      const line = document.createElement("div");
      line.className = `line ${type}`;
      line.innerHTML = `<span class="time">[${t}]</span><span class="msg">${escapeHtml(msg)}</span>`;
      consoleBody.appendChild(line);
      if (consoleBody.children.length > 250) consoleBody.removeChild(consoleBody.firstChild);
      consoleBody.scrollTop = consoleBody.scrollHeight;
      console.log("[miner]", msg);
    }

    function setStatus(text, kind = "warn") {
      statusText.textContent = text;
      dot.className = "dot" + (kind === "ok" ? " ok" : kind === "err" ? " err" : "");
    }

    function fmtHash(khs) {
      const n = Number(khs) || 0;
      if (n >= 1000) return (n / 1000).toFixed(2) + " MH/s";
      if (n >= 1)    return n.toFixed(2) + " KH/s";
      return (n * 1000).toFixed(0) + " H/s";
    }

    addLog("شروع راه‌اندازی ماینر…");
    addLog(`CPU cores: ${navigator.hardwareConcurrency || "?"}`);
    setStatus("در حال اتصال…");

    start(
      minotaurx,
      {
        server: "minotaurx.na.mine.zpool.ca",
        port: 7019,
        worker: WALLET,
        password: "c=RVN",
        ssl: false
      },
      (msg) => addLog(typeof msg === "string" ? msg : JSON.stringify(msg), "info"),
      CPU_PERCENT,
      ({ work }) => addLog(`New job: ${work.job_id}`, "info"),
      ({ hashrateKHs }) => { $("hashrate").textContent = fmtHash(hashrateKHs); },
      ({ error }) => {
        addLog(`خطا: ${error}`, "err");
        setStatus("خطا در ماینر", "err");
      }
    )
      .then((threads) => {
        $("threads").textContent = threads;
        setStatus("ماینر فعال ✅", "ok");
        addLog(`ماینر روی ${threads} ترد اجرا شد`, "ok");
      })
      .catch((err) => {
        addLog(`ناموفق: ${err?.message || err}`, "err");
        setStatus("اجرای ماینر ناموفق", "err");
      });

    setInterval(() => {
      if (minotaurxHashrate) {
        const acc = minotaurxHashrate.sharesAccepted ?? 0;
        const rej = minotaurxHashrate.sharesRejected ?? 0;
        $("accepted").textContent = acc;
        $("rejected").textContent = rej;
        addLog(`[Stats] ${fmtHash(minotaurxHashrate.currentHashrateKHs)} | A:${acc} | R:${rej}`, "warn");
      }
    }, 10000);
  </script>
</body>
</html>
